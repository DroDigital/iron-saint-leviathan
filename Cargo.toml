[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
isl-sim = { path = "crates/sim" }
isl-data = { path = "crates/data" }
isl-render = { path = "crates/render" }
isl-audio = { path = "crates/audio" }
isl-input = { path = "crates/input" }
isl-assets = { path = "crates/assets" }
isl-ghost = { path = "crates/ghost" }
isl-save = { path = "crates/save" }
isl-ui = { path = "crates/ui" }

wgpu = "30.0.1"
winit = "0.30.13"
gilrs = "0.11.2"
kira = "0.12.6"
glam = { version = "0.34.3", features = ["serde", "libm"] }
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
rand_pcg = "0.10.2"
rand_core = "0.10.1"
directories = "6.0.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
thiserror = "2.0.21"
crc32fast = "1.5.5"
data-encoding = "2.11.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
