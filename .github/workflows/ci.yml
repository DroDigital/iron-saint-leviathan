name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test, validate, license check, screenshots, soak (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages (audio, input, software Vulkan for headless rendering)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Unit + integration tests
        run: cargo test --workspace
      - name: Content and PSX poly budgets
        run: cargo xtask validate
      - name: Asset license manifest
        run: cargo xtask check-licenses
      - name: Headless screenshots (lavapipe)
        env:
          ISL_NO_AUDIO: "1"
        run: cargo run --release -p iron-saint-leviathan -- --screenshots screenshots
      - name: Soak test (bot plays 10 simulated minutes, renders every 60th frame)
        env:
          ISL_NO_AUDIO: "1"
        run: cargo run --release -p iron-saint-leviathan -- --soak 600 60
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  build:
    name: Release build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p iron-saint-leviathan
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: cargo xtask package target/${{ matrix.target }}/release/iron-saint-leviathan dist ${{ matrix.platform }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask package target/${{ matrix.target }}/release/iron-saint-leviathan.exe dist ${{ matrix.platform }}
      - name: Ad-hoc sign and zip the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/IronSaintLeviathan.app
          cd dist && ditto -c -k --keepParent IronSaintLeviathan.app ../IronSaintLeviathan-macos-arm64.zip
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath IronSaintLeviathan-windows-x64.zip
      - name: Tarball (Linux)
        if: runner.os == 'Linux'
        run: tar -czf IronSaintLeviathan-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: IronSaintLeviathan-${{ matrix.name }}
          path: |
            IronSaintLeviathan-*.zip
            IronSaintLeviathan-*.tar.gz
